<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Wi-Fi QR Code Generator</title>

<script src="https://cdn.tailwindcss.com"></script>


</head>

<body class="bg-stone-100 min-h-screen">

<div class="min-h-screen flex items-center justify-center p-6">


    <div
        class="bg-white
               w-full
               max-w-lg
               rounded-2xl
               shadow-xl
               p-8"
    >


        <!-- Header -->

        <div class="text-center mb-8">

            <h1
                class="text-3xl
                       font-bold
                       text-stone-800"
            >
                Wi-Fi QR Code Generator
            </h1>

            <p class="text-stone-500 mt-2">
                Create a QR code that lets guests
                connect to your Wi-Fi instantly.
            </p>

        </div>


        <!-- Form -->

        <form method="POST" class="space-y-6">


            <!-- Wi-Fi Name -->

            <div>

                <label
                    class="block
                           text-sm
                           font-medium
                           text-stone-700
                           mb-2"
                >
                    Wi-Fi Network Name
                </label>

                <input
                    type="text"
                    name="wifi_name"
                    placeholder="e.g. My Home WiFi"
                    required

                    class="w-full
                           px-4
                           py-3
                           border
                           border-stone-300
                           rounded-xl
                           focus:outline-none
                           focus:ring-2
                           focus:ring-emerald-500
                           focus:border-emerald-500"
                >

            </div>


            <!-- Password -->

            <div>

                <label
                    class="block
                           text-sm
                           font-medium
                           text-stone-700
                           mb-2"
                >
                    Wi-Fi Password
                </label>

                <input
                    type="password"
                    name="wifi_password"
                    placeholder="Enter Wi-Fi password"
                    required

                    class="w-full
                           px-4
                           py-3
                           border
                           border-stone-300
                           rounded-xl
                           focus:outline-none
                           focus:ring-2
                           focus:ring-emerald-500
                           focus:border-emerald-500"
                >

            </div>


            <!-- Security -->

            <div>

                <label
                    class="block
                           text-sm
                           font-medium
                           text-stone-700
                           mb-2"
                >
                    Security Type
                </label>

                <select
                    name="security"

                    class="w-full
                           px-4
                           py-3
                           border
                           border-stone-300
                           rounded-xl
                           bg-white
                           focus:outline-none
                           focus:ring-2
                           focus:ring-emerald-500
                           focus:border-emerald-500"
                >

                    <option value="WPA">
                        WPA / WPA2 / WPA3
                    </option>

                    <option value="WEP">
                        WEP
                    </option>

                    <option value="nopass">
                        No Password
                    </option>

                </select>

            </div>


            <!-- Generate -->

            <button
                type="submit"

                class="w-full
                       bg-emerald-700
                       hover:bg-emerald-800
                       text-white
                       font-semibold
                       py-3
                       rounded-xl
                       transition"
            >
                Generate Wi-Fi QR Code
            </button>


        </form>


    </div>

</div>

</body>

</html>
