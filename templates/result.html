<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Wi-Fi QR Code</title>

<script src="https://cdn.tailwindcss.com"></script>


<!-- Print Styling -->

<style>

    @media print {

        body {
            background: white !important;
        }

        .no-print {
            display: none !important;
        }

        .a4-page {
            width: 210mm;
            height: 297mm;
            margin: 0;
            box-shadow: none !important;
            border-radius: 0 !important;
        }

    }

</style>


</head>

<body class="bg-stone-100 min-h-screen">

<!-- Navigation -->

<div class="no-print">

    <nav class="bg-white shadow-sm">

        <div class="max-w-6xl mx-auto px-6 py-3">

            <div class="flex justify-between items-center">

                <h1 class="font-bold text-lg text-stone-800">
                    Wi-Fi QR Generator
                </h1>

                <a
                    href="/"
                    class="text-sm
                           text-emerald-700
                           hover:text-emerald-800
                           font-medium"
                >
                    Create New
                </a>

            </div>

        </div>

    </nav>

</div>


<!-- Main Content -->

<main class="py-6 px-6">


    <!-- Action Buttons -->

    <div
        class="no-print
               max-w-xl
               mx-auto
               mb-6
               flex
               flex-col
               sm:flex-row
               gap-3"
    >


        <!-- Print -->

        <button
            onclick="window.print()"

            class="flex-1
                   bg-emerald-700
                   hover:bg-emerald-800
                   text-white
                   text-sm
                   font-semibold
                   py-2.5
                   rounded-lg
                   transition"
        >
            Print A4
        </button>


        <!-- Download -->

        <a
            href="{{ url_for(
                'static',
                filename='generated/' + qr_code
            ) }}"

            download="wifi_qrcode.png"

            class="flex-1
                   text-center
                   bg-stone-800
                   hover:bg-stone-900
                   text-white
                   text-sm
                   font-semibold
                   py-2.5
                   rounded-lg
                   transition"
        >
            Download QR Code
        </a>


    </div>


    <!-- A4 Page -->

    <div
        class="a4-page
               bg-white
               max-w-[210mm]
               min-h-[297mm]
               mx-auto
               shadow-xl
               rounded-lg
               p-12
               flex
               flex-col
               items-center"
    >


        <!-- Title -->

        <div class="text-center mt-8">

            <h2
                class="text-5xl
                       font-bold
                       text-stone-800"
            >
                Connect to Our Wi-Fi
            </h2>

            <p
                class="text-stone-500
                       mt-5
                       text-xl"
            >
                Scan the QR code with your phone
                to connect automatically.
            </p>

        </div>


        <!-- QR Code -->

        <div
            class="mt-12
                   p-6
                   border-4
                   border-stone-100
                   rounded-3xl"
        >

            <img
                src="{{ url_for(
                    'static',
                    filename='generated/' + qr_code
                ) }}"

                class="w-80 h-80"
                alt="Wi-Fi QR Code"
            >

        </div>


        <!-- Wi-Fi Information -->

        <div
            class="mt-12
                   w-full
                   max-w-lg
                   text-center"
        >


            <!-- Network Name -->

            <div class="mb-8">

                <p
                    class="text-sm
                           font-medium
                           text-stone-500
                           tracking-widest"
                >
                    NETWORK NAME
                </p>

                <p
                    class="text-3xl
                           font-bold
                           text-stone-800
                           break-words
                           mt-2"
                >
                    {{ wifi_name }}
                </p>

            </div>


            <!-- Password -->

            <div class="mb-8">

                <p
                    class="text-sm
                           font-medium
                           text-stone-500
                           tracking-widest"
                >
                    PASSWORD
                </p>

                <p
                    class="text-2xl
                           font-semibold
                           text-stone-700
                           break-words
                           mt-2"
                >
                    {{ wifi_password }}
                </p>

            </div>


            <!-- Security -->

            <div>

                <p
                    class="text-sm
                           font-medium
                           text-stone-500
                           tracking-widest"
                >
                    SECURITY
                </p>

                <p
                    class="text-xl
                           text-stone-700
                           mt-2"
                >
                    {{ security }}
                </p>

            </div>

        </div>


    </div>


</main>

</body>

</html>
